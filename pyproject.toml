[project]
name = "rtabmap_hloc_reprocess"
version = "0.1.0"
readme = "README.md"
description = "Convert RTABMap database to COLMAP/HLOC format and perform sparse reconstruction"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "RTABMap-HLOC contributors"}]
keywords = ["rtabmap", "hloc", "colmap", "structure-from-motion", "reconstruction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "h5py",
    "torch",
    "tqdm",
    "matplotlib",
    "pillow",
    "jsonschema>=4.21,<5",
    "pycolmap>=3.13,<5",
    "hloc @ git+https://github.com/cvg/Hierarchical-Localization.git@c13273bd0ecc2917a35910fd843712a1c6243193",
]

[project.optional-dependencies]
onnx = ["onnxruntime-gpu[cuda,cudnn]>=1.26.0"]
dev = [
    "pytest",
    "black",
    "isort",
    "build>=1.2,<2",
    "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/HomeSpatial/rtabmap_hloc"
Issues = "https://github.com/HomeSpatial/rtabmap_hloc/issues"
Documentation = "https://github.com/HomeSpatial/rtabmap_hloc#readme"

[project.scripts]
rtabmap-hloc = "rtabmap_hloc_reprocess.cli:main"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtabmap_hloc_reprocess = ["_exchange/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
